[package]
name = "local-totp-cli-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Offline TOTP from local QR images with native OS credential storage"
license = "MIT"
readme = "README.md"

[lib]
name = "totp_cli"

[[bin]]
name = "totp"
path = "src/main.rs"

[features]
native-test = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
data-encoding = "2.9"
dirs = "6.0"
fs2 = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
icu_casemap = "2.3"
rqrr = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
totp-rs = { version = "6.0", default-features = false, features = ["std", "zeroize"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[profile.release]
lto = "thin"
strip = true
